<main class="news-page" data-testid="news-page">
  <header class="news-page__hero" aria-labelledby="news-page-title">
    <p class="news-page__eyebrow">{{ 'news.eyebrow' | t }}</p>
    <h1 id="news-page-title" class="news-page__title">{{ 'news.title' | t }}</h1>
    <p class="news-page__intro">{{ 'news.description' | t }}</p>
  </header>

  <section
    class="news-page__empty"
    data-testid="news-empty-state"
    [attr.aria-label]="'news.empty.ariaLabel' | t"
  >
    <div class="news-page__empty-icon" aria-hidden="true">
      <svg lucideNewspaper focusable="false" [size]="32" [strokeWidth]="1.8"></svg>
    </div>

    <div class="news-page__empty-copy">
      <h2 class="news-page__empty-title">{{ 'news.empty.title' | t }}</h2>
      <p class="news-page__empty-description" data-testid="news-empty-message">
        {{ 'news.empty.description' | t }}
      </p>
      <a
        class="news-page__empty-cta"
        routerLink="/festivales"
        data-testid="news-empty-cta"
      >
        {{ 'news.empty.cta' | t }}
        <svg lucideArrowRight aria-hidden="true" focusable="false" [size]="20" [strokeWidth]="2"></svg>
      </a>
    </div>
  </section>
</main>
